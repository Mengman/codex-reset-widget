name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = ./scripts/release-version.ps1 -Tag $env:RELEASE_TAG
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build, test and verify versioned package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build.ps1 -Publish -RunUiChecks -Version $env:RELEASE_VERSION
      - name: Upload release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-assets
          path: |
            artifacts/releases/CodexResetWidget-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/releases/CodexResetWidget-${{ steps.version.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-reports
          path: |
            artifacts/releases/domain-tests.txt
            artifacts/releases/ui-*/**
            artifacts/releases/Package check*/package-checks.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: release-assets
      - name: Verify downloaded checksum
        working-directory: release-assets
        run: sha256sum --check "CodexResetWidget-${RELEASE_VERSION}-win-x64.zip.sha256"
      - name: Publish GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          archive="release-assets/CodexResetWidget-${RELEASE_VERSION}-win-x64.zip"
          checksum="${archive}.sha256"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--verify-tag --draft --generate-notes --title "Codex Reset ${RELEASE_VERSION}")
            if [[ "$PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" "$archive" "$checksum" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
