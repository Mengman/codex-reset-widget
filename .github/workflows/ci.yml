name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Build, test and verify portable package
        run: ./scripts/build.ps1 -Publish -RunUiChecks
      - name: Upload portable package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64
          path: |
            artifacts/releases/CodexResetWidget-*-win-x64.zip
            artifacts/releases/CodexResetWidget-*-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-reports
          path: |
            artifacts/releases/domain-tests.txt
            artifacts/releases/ui-*/**
            artifacts/releases/Package check*/package-checks.json
          if-no-files-found: warn
          retention-days: 14
